<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <base href=".">
  <title>Fiche partenaire — miroir Canva</title>
  <style>
    html,body{height:100%;margin:0;background:#fff}
    #wrap{position:fixed;inset:0}
    #view{position:absolute;inset:0;border:0;width:100%;height:100%}
    #sendBtn{
      position:fixed; right:12px; bottom:12px; z-index:999999;
      padding:10px 14px; border:0; border-radius:10px;
      background:#111; color:#fff; font-weight:700; cursor:pointer;
      box-shadow:0 6px 20px rgba(0,0,0,.18)
    }
    #toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
      background:#111;color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:999999}
    #toast.ok{background:#1a7f37} #toast.err{background:#b91c1c}
  </style>
  <!-- html2canvas -->
  <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <div id="wrap">
    <iframe id="view" src="" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox" title="Fiche Canva"></iframe>
  </div>

  <button id="sendBtn">📄 Envoyer au Sheet</button>
  <div id="toast"></div>

  <script>
  // ====== CONFIG ======
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbxwaO5PB0nLuXcoLE2yZN_EX2jj-qI8VO0B25txjeuZSA0qS0I0oJuxaYo87_2OaZsi_g/exec";
  const WIDGET_PATH = "./assets/_website-element-widget.html";

  const params = new URLSearchParams(location.search);
  const row = Number(params.get("row") || 0);
  const iframe = document.getElementById("view");

  // Charger l’iframe avec ?row=…
  const widgetUrl = new URL(WIDGET_PATH, location.href);
  if (row) {
    const p = new URL(widgetUrl);
    p.searchParams.set("row", row);
    iframe.src = p.toString();
  } else {
    iframe.src = widgetUrl.toString();
  }

  function toast(msg, ok=true){
    const t = document.getElementById('toast');
    t.className = ok ? 'ok' : 'err';
    t.id = 'toast';
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(()=> t.style.display='none', 4500);
  }

  function findRecapElement(doc){
    // IDs connus en priorité
    let el = doc.getElementById('recapPrestations') || doc.getElementById('recapitulatifZone');
    if (el) return el;
    // Fallback : un titre contenant "RÉCAPITULATIF"
    const heads = Array.from(doc.querySelectorAll('h1,h2,h3'));
    const h = heads.find(e => /RÉCAPITULATIF/i.test((e.textContent || '').trim()));
    return h ? (h.parentElement || h) : doc.body;
  }

  async function captureRecapPNG(innerDoc){
    const el = findRecapElement(innerDoc);
    // scroll vers le bloc + attendre layout
    el.scrollIntoView({block:'center'});
    await new Promise(r => setTimeout(r, 200));

    // cacher le bouton overlay du parent pendant la capture
    const btn = document.getElementById('sendBtn');
    const prevVis = btn.style.visibility;
    btn.style.visibility = 'hidden';

    try{
      const canvas = await html2canvas(el, {
        backgroundColor: '#ffffff',
        scale: 2,
        useCORS: true,
        allowTaint: true,
        foreignObjectRendering: true,
        windowWidth: innerDoc.documentElement.scrollWidth,
        windowHeight: el.scrollHeight
      });
      return { dataUrl: canvas.toDataURL('image/png'), w: canvas.width, h: canvas.height };
    } finally {
      btn.style.visibility = prevVis || 'visible';
    }
  }

  // ====== Envoi no-cors (on ne lit pas la réponse) ======
  async function sendPdf(){
    try{
      if (!row || row < 2) { toast('Lien sans ?row=… : ouvre la fiche depuis la colonne Y.', false); return; }
      if (!iframe || !iframe.contentDocument){ toast("Iframe interne introuvable.", false); return; }

      // 1) Capture la zone récap en PNG (dans l’IFRAME)
      const { dataUrl, w, h } = await captureRecapPNG(iframe.contentDocument);

      // 2) Envoi vers Apps Script (no-cors)
      await fetch(ENDPOINT, {
        method:'POST',
        mode:'no-cors',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ action:'imageToPdf', row, png: dataUrl, w, h })
      });

      toast('Envoi déclenché ✔ — vérifie la colonne Z (lien) / AA (statut).');
    }catch(err){
      console.error('sendPdf fatal:', err);
      toast('Erreur JS: ' + err.message, false);
    }
  }

  document.getElementById("sendBtn").addEventListener("click", sendPdf);
  </script>
</body>
</html>
