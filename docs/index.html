<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <base href=".">
  <title>Fiche partenaire — miroir Canva</title>
  <style>
    html,body{height:100%;margin:0;background:#fff}
    #wrap{position:fixed;inset:0}
    #view{position:absolute;inset:0;border:0;width:100%;height:100%}
    #sendBtn{
      position:fixed; right:12px; bottom:12px; z-index:999999;
      padding:10px 14px; border:0; border-radius:10px;
      background:#111; color:#fff; font-weight:700; cursor:pointer;
      box-shadow:0 6px 20px rgba(0,0,0,.18)
    }
    #toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
      background:#111;color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:999999}
    #toast.ok{background:#1a7f37} #toast.err{background:#b91c1c}
  </style>
</head>
<body>
  <div id="wrap">
    <iframe id="view"
            src=""
            sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"
            title="Fiche Canva"></iframe>
  </div>

  <button id="sendBtn">📄 Envoyer au Sheet</button>
  <div id="toast"></div>

  <script>
  /************ CONFIG ************/
  const ENDPOINT    = "https://script.google.com/macros/s/AKfycbxwaO5PB0nLuXcoLE2yZN_EX2jj-qI8VO0B25txjeuZSA0qS0I0oJuxaYo87_2OaZsi_g/exec";
  const WIDGET_PATH = "./assets/_website-element-widget.html";
  const DOMTOIMAGE_CDN = "https://cdn.jsdelivr.net/npm/dom-to-image-more@3.2.0/dist/dom-to-image-more.min.js";

  const params = new URLSearchParams(location.search);
  const row    = Number(params.get("row") || 0);
  const iframe = document.getElementById("view");

  // Charge l’iframe avec ?row=…
  (function initIframe(){
    const url = new URL(WIDGET_PATH, location.href);
    if (row) url.searchParams.set("row", row);
    iframe.src = url.toString();
  })();

  function toast(msg, ok=true){
    const t = document.getElementById('toast');
    t.className = ok ? 'ok' : 'err';
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(()=> t.style.display='none', 4500);
  }

  // Injecte le code de capture DANS l’iframe
  async function injectCaptureScriptIntoIframe(){
    if (!iframe.contentDocument || iframe.contentDocument.readyState === 'loading') {
      await new Promise(r => iframe.addEventListener('load', r, {once:true}));
    }
    const doc = iframe.contentDocument;
    const win = iframe.contentWindow;

    // 1) inject dom-to-image-more si besoin
    if (!win.domtoimage) {
      await new Promise((resolve, reject) => {
        const s = doc.createElement('script');
        s.src = DOMTOIMAGE_CDN;
        s.onload = resolve;
        s.onerror = () => reject(new Error('dom-to-image injection failed'));
        (doc.head || doc.documentElement).appendChild(s);
      });
    }

    // 2) inject notre worker si pas encore présent
    if (!doc.getElementById('__capture_worker__')) {
      const worker = doc.createElement('script');
      worker.id = '__capture_worker__';
      worker.type = 'text/javascript';
      worker.text = `
        (function(){
          if (window.__captureReady__) return;
          window.__captureReady__ = true;

          function getRecapEl(){
            return document.getElementById('recapitulatifZone') || document.body;
          }

          async function capture(){
            const el = getRecapEl();
            el.scrollIntoView({block:'center'});
            await new Promise(r => setTimeout(r, 250));
            const dataUrl = await window.domtoimage.toPng(el, {
              bgcolor:'#ffffff',
              quality:1,
              width:el.scrollWidth,
              height:el.scrollHeight,
              style:{transform:'none'},
              filter: (node)=> !(node.classList && node.classList.contains('no-print')),
              cacheBust:true
            });
            return dataUrl;
          }

          window.addEventListener('message', async (ev)=>{
            try{
              if (!ev.data || ev.data.type !== 'CAPTURE') return;
              const png = await capture();
              ev.source.postMessage({ type:'CAPTURE_DONE', png }, '*');
            }catch(e){
              ev.source.postMessage({ type:'CAPTURE_ERR', error: String(e) }, '*');
            }
          });
        })();
      `;
      (doc.head || doc.documentElement).appendChild(worker);
    }
  }

  // Parent → demande CAPTURE, puis reçoit le PNG
  async function requestPngFromIframe(){
    await injectCaptureScriptIntoIframe();

    const png = await new Promise((resolve, reject)=>{
      const onMsg = (ev)=>{
        if (!ev.data || !ev.data.type) return;
        if (ev.data.type === 'CAPTURE_DONE') {
          window.removeEventListener('message', onMsg);
          resolve(ev.data.png);
        }
        if (ev.data.type === 'CAPTURE_ERR') {
          window.removeEventListener('message', onMsg);
          reject(new Error(ev.data.error || 'capture error'));
        }
      };
      window.addEventListener('message', onMsg);
      iframe.contentWindow.postMessage({ type:'CAPTURE' }, '*');
      setTimeout(()=>{ window.removeEventListener('message', onMsg); reject(new Error('capture timeout')); }, 8000);
    });

    return png;
  }

  // Envoi no-cors vers Apps Script
  async function sendPdf(){
    try{
      if (!row || row < 2) { toast('Lien sans ?row=… : ouvre la fiche depuis la colonne Y.', false); return; }
      const pngDataUrl = await requestPngFromIframe();
      if (!pngDataUrl || !pngDataUrl.startsWith('data:image/png')) {
        toast('Capture PNG vide — vérifie #recapitulatifZone.', false);
        return;
      }
      await fetch(ENDPOINT, {
        method:'POST',
        mode:'no-cors',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ action:'imageToPdf', row, png: pngDataUrl })
      });
      toast('Envoi déclenché ✔ — vérifie colonne Z (lien) / AA (statut).');
    }catch(err){
      console.error('sendPdf fatal:', err);
      toast('Erreur JS: ' + err.message, false);
    }
  }

  document.getElementById('sendBtn').addEventListener('click', sendPdf);
  </script>
</body>
</html>
