<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <base href=".">
  <title>Fiche partenaire — miroir Canva</title>
  <style>
    html,body{height:100%;margin:0;background:#fff}
    #wrap{position:fixed;inset:0}
    #view{position:absolute;inset:0;border:0;width:100%;height:100%}
    .btn{position:fixed; right:12px; z-index:999999; padding:10px 14px; border:0; border-radius:10px;
         background:#111; color:#fff; font-weight:700; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,.18)}
    #sendBtn{bottom:12px}
    #dlBtn{bottom:56px}
    #toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#111;color:#fff;
           padding:10px 14px;border-radius:8px;display:none;z-index:999999}
    #toast.ok{background:#1a7f37} #toast.err{background:#b91c1c}
  </style>
  <!-- dom-to-image-more + jsPDF chargés dans l’IFRAME (pas dans la page parente) -->
</head>
<body>
  <div id="wrap">
    <iframe id="view"
      src=""
      sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"
      title="Fiche Canva"></iframe>
  </div>

  <button id="dlBtn"   class="btn">📸 Télécharger PNG test</button>
  <button id="sendBtn" class="btn">📄 Envoyer au Sheet</button>
  <div id="toast"></div>

  <script>
  /* ===== CONFIG ===== */
  const ENDPOINT    = "https://script.google.com/macros/s/AKfycbxwaO5PB0nLuXcoLE2yZN_EX2jj-qI8VO0B25txjeuZSA0qS0I0oJuxaYo87_2OaZsi_g/exec";
  const WIDGET_PATH = "./assets/_website-element-widget.html";
  const DOMTOIMAGE_CDN = "https://cdn.jsdelivr.net/npm/dom-to-image-more@3.2.0/dist/dom-to-image-more.min.js";
  const JSPDF_CDN      = "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js";

  const params = new URLSearchParams(location.search);
  const row    = Number(params.get("row") || 0);
  const iframe = document.getElementById("view");

  // Charger l’IFRAME avec ?row=…
  (function initIframe(){
    const url = new URL(WIDGET_PATH, location.href);
    if (row) url.searchParams.set("row", row);
    iframe.src = url.toString();
  })();

  function toast(msg, ok=true){
    const t = document.getElementById('toast');
    t.className = ok ? 'ok' : 'err';
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(()=> t.style.display='none', 4500);
  }

  /* ===== Injection dans l’IFRAME ===== */
  async function ensureLibsInIframe(){
    if (!iframe.contentDocument || iframe.contentDocument.readyState === 'loading') {
      await new Promise(r => iframe.addEventListener('load', r, {once:true}));
    }
    const win = iframe.contentWindow;
    const doc = iframe.contentDocument;

    // dom-to-image
    if (!win.domtoimage) {
      await new Promise((resolve, reject)=>{
        const s = doc.createElement('script');
        s.src = DOMTOIMAGE_CDN;
        s.onload = resolve;
        s.onerror = ()=>reject(new Error('dom-to-image injection failed'));
        (doc.head || doc.documentElement).appendChild(s);
      });
    }
    // jsPDF
    if (!win.jspdf) {
      await new Promise((resolve, reject)=>{
        const s = doc.createElement('script');
        s.src = JSPDF_CDN;
        s.onload = resolve;
        s.onerror = ()=>reject(new Error('jsPDF injection failed'));
        (doc.head || doc.documentElement).appendChild(s);
      });
    }

    // Worker de capture si absent
    if (!doc.getElementById('__capture_worker__')) {
      const w = doc.createElement('script');
      w.id = '__capture_worker__';
      w.text = `
        (function(){
          if (window.__capReady__) return; window.__capReady__=true;

          function getRecapEl(){ return document.getElementById('recapitulatifZone') || document.body; }

          async function capturePng(){
            const el = getRecapEl();
            el.scrollIntoView({block:'center'});
            await new Promise(r => setTimeout(r, 250));
            return window.domtoimage.toPng(el, {
              bgcolor:'#ffffff',
              quality:1,
              width:  el.scrollWidth,
              height: el.scrollHeight,
              style:{transform:'none'},
              filter:(n)=>!(n.classList && n.classList.contains('no-print')),
              cacheBust:true
            });
          }

          function pngToPdfDataUrl(png){
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation:'p', unit:'pt', format:'a4' });
            const margin = 34, pageW = pdf.internal.pageSize.getWidth();
            const drawW = pageW - margin*2;
            pdf.addImage(png, 'PNG', margin, margin, drawW, 0, undefined, 'FAST');
            return pdf.output('datauristring'); // data:application/pdf;base64,...
          }

          window.addEventListener('message', async (ev)=>{
            if (!ev.data || !ev.data.type) return;
            try{
              if (ev.data.type==='CAPTURE_PNG'){
                const png = await capturePng();
                ev.source.postMessage({ type:'CAPTURE_PNG_DONE', png }, '*');
              }
              if (ev.data.type==='CAPTURE_PDF'){
                const png = await capturePng();
                const pdf = pngToPdfDataUrl(png);
                ev.source.postMessage({ type:'CAPTURE_PDF_DONE', pdf }, '*');
              }
            }catch(e){
              ev.source.postMessage({ type:'CAPTURE_ERR', error:String(e) }, '*');
            }
          });
        })();
      `;
      (doc.head || doc.documentElement).appendChild(w);
    }
  }

  async function requestFromIframe(type){
    await ensureLibsInIframe();
    return new Promise((resolve, reject)=>{
      const onMsg = (ev)=>{
        if (!ev.data || !ev.data.type) return;
        if (ev.data.type === type + '_DONE') { window.removeEventListener('message', onMsg); resolve(ev.data[type.toLowerCase()]); }
        if (ev.data.type === 'CAPTURE_ERR')   { window.removeEventListener('message', onMsg); reject(new Error(ev.data.error || 'capture error')); }
      };
      window.addEventListener('message', onMsg);
      iframe.contentWindow.postMessage({ type }, '*');
      setTimeout(()=>{ window.removeEventListener('message', onMsg); reject(new Error(type+' timeout')); }, 10000);
    });
  }

  // Bouton test : télécharge le PNG pour vérifier visuellement la capture
  document.getElementById('dlBtn').addEventListener('click', async ()=>{
    try{
      const png = await requestFromIframe('CAPTURE_PNG');
      if (!png || !png.startsWith('data:image/png')) { toast('PNG vide', false); return; }
      const a = document.createElement('a'); a.href = png; a.download = 'recap.png'; a.click();
      toast('PNG téléchargé ✔');
    }catch(e){ console.error(e); toast(e.message, false); }
  });

  // Bouton envoi : envoie le PDF côté client vers Apps Script (no-cors)
  document.getElementById('sendBtn').addEventListener('click', async ()=>{
    try{
      if (!row || row < 2) { toast('Lien sans ?row=… : ouvre depuis la colonne Y.', false); return; }
      const pdfDataUrl = await requestFromIframe('CAPTURE_PDF');
      if (!pdfDataUrl || !/^data:application\/pdf/i.test(pdfDataUrl)) { toast('PDF vide', false); return; }

      await fetch(ENDPOINT, {
        method:'POST',
        mode:'no-cors',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ action:'savePdf', row, pdf: pdfDataUrl })
      });
      toast('Envoi déclenché ✔ — vérifie Z (lien) / AA (statut).');
    }catch(e){ console.error(e); toast(e.message, false); }
  });
  </script>
</body>
</html>
