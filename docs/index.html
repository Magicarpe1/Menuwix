<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <base href=".">
  <title>Fiche partenaire — miroir Canva</title>
  <style>
    html,body{height:100%;margin:0;background:#fff}
    #wrap{position:fixed;inset:0}
    #view{position:absolute;inset:0;border:0;width:100%;height:100%}
    #sendBtn{
      position:fixed; right:12px; bottom:12px; z-index:999999;
      padding:10px 14px; border:0; border-radius:10px;
      background:#111; color:#fff; font-weight:700; cursor:pointer;
      box-shadow:0 6px 20px rgba(0,0,0,.18)
    }
    #toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
      background:#111;color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:999999}
    #toast.ok{background:#1a7f37} #toast.err{background:#b91c1c}
  </style>
  <!-- dom-to-image-more (styles calculés + fonts embarqués) -->
  <script src="https://cdn.jsdelivr.net/npm/dom-to-image-more@3.2.0/dist/dom-to-image-more.min.js"></script>
</head>
<body>
  <div id="wrap">
    <iframe id="view"
            src=""
            sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"
            title="Fiche Canva"></iframe>
  </div>

  <button id="sendBtn">📄 Envoyer au Sheet</button>
  <div id="toast"></div>

  <script>
  /************ CONFIG ************/
  // ⚠️ URL PUBLIQUE /exec (pas la version /a/macros/…)
  const ENDPOINT    = "https://script.google.com/macros/s/AKfycbxwaO5PB0nLuXcoLE2yZN_EX2jj-qI8VO0B25txjeuZSA0qS0I0oJuxaYo87_2OaZsi_g/exec";
  const WIDGET_PATH = "./assets/_website-element-widget.html";

  const params = new URLSearchParams(location.search);
  const row    = Number(params.get("row") || 0);
  const iframe = document.getElementById("view");

  // Charge l’iframe avec ?row=…
  (function initIframe(){
    const widgetUrl = new URL(WIDGET_PATH, location.href);
    if (row) {
      const p = new URL(widgetUrl);
      p.searchParams.set("row", row);
      iframe.src = p.toString();
    } else {
      iframe.src = widgetUrl.toString();
    }
  })();

  function toast(msg, ok=true){
    const t = document.getElementById('toast');
    t.className = ok ? 'ok' : 'err';
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(()=> t.style.display='none', 4500);
  }

  /************ Sélection stricte de la zone récap ************/
  function getRecapEl(doc){
    // ID exact que tu m’as donné :
    const el = doc.getElementById('recapitulatifZone');
    if (el) return el;
    // fallback si l’ID change un jour :
    const h = Array.from(doc.querySelectorAll('h1,h2,h3'))
      .find(e => /RÉCAPITULATIF/i.test((e.textContent || '').trim()));
    return h ? (h.parentElement || h) : doc.body;
  }

  /************ Capture PNG via dom-to-image-more ************/
  async function captureRecapPNG(innerDoc){
    const el = getRecapEl(innerDoc);
    el.scrollIntoView({block:'center'});
    await new Promise(r => setTimeout(r, 250)); // laisse le layout se stabiliser

    // cache le bouton overlay pendant la capture
    const btn = document.getElementById('sendBtn');
    const prevVis = btn.style.visibility; btn.style.visibility = 'hidden';

    try{
      // largeur max raisonnable pour A4 (haute qualité)
      const scale = 2; // x2 retina-like
      const dataUrl = await window.domtoimage.toPng(el, {
        bgcolor: '#ffffff',
        style: { 'transform': 'none' }, // neutralise d’éventuels transforms
        width:  el.scrollWidth,
        height: el.scrollHeight,
        quality: 1,
        // Filtre optionnel pour exclure d’éventuels éléments interactifs
        filter: (node) => {
          // exclure zone "no-print" s’il y en a
          if (node.classList && node.classList.contains('no-print')) return false;
          return true;
        },
        // taille “virtuelle” de rendu
        imagePlaceholder: undefined,
        cacheBust: true,
      });
      return dataUrl;
    } finally {
      btn.style.visibility = prevVis || 'visible';
    }
  }

  /************ Envoi no-cors vers Apps Script ************/
  async function sendPdf(){
    try{
      if (!row || row < 2) { toast('Lien sans ?row=… : ouvre la fiche depuis la colonne Y.', false); return; }

      // attendre que l’iframe soit prête
      if (!iframe.contentDocument || iframe.contentDocument.readyState === 'loading') {
        await new Promise(r => iframe.addEventListener('load', r, {once:true}));
      }
      const doc = iframe.contentDocument;
      if (!doc) { toast("Iframe interne introuvable.", false); return; }

      // 1) Capture PNG
      const pngDataUrl = await captureRecapPNG(doc);
      if (!pngDataUrl || !pngDataUrl.startsWith('data:image/png')) {
        toast('Capture PNG vide — vérifie #recapitulatifZone.', false);
        return;
      }

      // 2) Envoi vers Apps Script (no-cors)
      await fetch(ENDPOINT, {
        method:'POST',
        mode:'no-cors', // on ne lit pas la réponse ; Apps Script écrit Z/AA
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ action:'imageToPdf', row, png: pngDataUrl })
      });

      toast('Envoi déclenché ✔ — vérifie la colonne Z (lien) et AA (statut).');
    }catch(err){
      console.error('sendPdf fatal:', err);
      toast('Erreur JS: ' + err.message, false);
    }
  }

  document.getElementById("sendBtn").addEventListener("click", sendPdf);
  </script>
</body>
</html>
