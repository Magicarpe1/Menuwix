<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <base href=".">
  <title>Fiche partenaire — miroir Canva</title>
  <style>
    html,body{height:100%;margin:0;background:#fff}
    #wrap{position:fixed;inset:0}
    #view{position:absolute;inset:0;border:0;width:100%;height:100%}
    #sendBtn{
      position:fixed; right:12px; bottom:12px; z-index:999999;
      padding:10px 14px; border:0; border-radius:10px;
      background:#111; color:#fff; font-weight:700; cursor:pointer;
      box-shadow:0 6px 20px rgba(0,0,0,.18)
    }
    #toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
      background:#111;color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:999999}
    #toast.ok{background:#1a7f37} #toast.err{background:#b91c1c}
  </style>
</head>
<body>
  <div id="wrap">
    <!-- On propage ?row=… vers le widget -->
    <iframe id="view" src="" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox" title="Fiche Canva"></iframe>
  </div>

  <button id="sendBtn">📄 Envoyer au Sheet</button>
  <div id="toast"></div>

  <script>
  // ====== CONFIG ======
  // ⚠️ COLLE ICI L’URL PUBLIQUE /exec (sans /a/macros/lakolo.fr/)
  const ENDPOINT = "https://script.google.com/macros/s/AKfycbxwaO5PB0nLuXcoLE2yZN_EX2jj-qI8VO0B25txjeuZSA0qS0I0oJuxaYo87_2OaZsi_g/exec";
  const WIDGET_PATH = "./assets/_website-element-widget.html";

  const params = new URLSearchParams(location.search);
  const row = Number(params.get("row") || 0);
  const iframe = document.getElementById("view");

  // Charger le widget avec ?row=…
  const widgetUrl = new URL(WIDGET_PATH, location.href);
  if (row) {
    const p = new URL(widgetUrl);
    p.searchParams.set("row", row);
    iframe.src = p.toString();
  } else {
    iframe.src = widgetUrl.toString();
  }

  function toast(msg, ok=true){
    const t = document.getElementById('toast');
    t.className = ok ? 'ok' : 'err';
    t.id = 'toast';
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(()=> t.style.display='none', 4500);
  }

  // Snapshot robuste (base + CSS impression + valeurs saisies)
  function snapshotInnerHtml(innerDoc){
    try{
      let html = '<!DOCTYPE html>' + innerDoc.documentElement.outerHTML;
      const baseHref = innerDoc.location.href.replace(/[^\/]*$/,'');
      const inject = `
        <base href="${baseHref}">
        <style>
          @page{size:A4;margin:12mm}
          *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
          /* Pour n'imprimer que le récap, décommente :
          body *{display:none!important;visibility:hidden!important}
          h1,h2,h3{display:block!important;visibility:visible!important}
          */
        </style>
      `;
      if (html.includes('</head>')) html = html.replace('</head>', inject + '</head>');
      else html = html.replace('<html', '<html><head>'+inject+'</head>');

      try{
        const inputs = innerDoc.querySelectorAll('input,textarea,select');
        inputs.forEach(el => {
          if (el.tagName==='TEXTAREA') el.textContent = el.value || '';
          else if (el.tagName==='SELECT') {
            el.setAttribute('value', el.value || '');
            const sel = el.options[el.selectedIndex];
            if (sel) el.setAttribute('data-selected-text', sel.text);
          } else {
            el.setAttribute('value', el.value || '');
            if (el.type==='checkbox'||el.type==='radio'){
              if (el.checked) el.setAttribute('checked','checked'); else el.removeAttribute('checked');
            }
          }
        });
        html = '<!DOCTYPE html>' + innerDoc.documentElement.outerHTML;
        if (html.includes('</head>')) html = html.replace('</head>', inject + '</head>');
      }catch(e){ console.warn('Remontée des valeurs :', e); }

      return html;
    }catch(e){
      console.error('snapshotInnerHtml error:', e);
      return '<!DOCTYPE html>' + innerDoc.documentElement.outerHTML;
    }
  }

  async function sendPdf(){
    try{
      if (!row || row < 2) { toast('Lien sans ?row=… : ouvre la fiche depuis la colonne Y.', false); return; }
      if (!iframe || !iframe.contentDocument){ toast("Iframe interne introuvable.", false); return; }

      // Ping pour vérifier l’accès
      try{
        const ping = await fetch(ENDPOINT, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({action:'ping'})
        });
        console.log('PING status:', ping.status);
        if (ping.status === 401 || ping.status === 403) {
          toast('Web App non public (401/403). Déploie : "Moi" + "Tout le monde".', false);
          return;
        }
      }catch(err){
        console.error('PING error:', err);
        toast('Impossible de joindre Apps Script. Vérifie ENDPOINT /exec.', false);
        return;
      }

      const html = snapshotInnerHtml(iframe.contentDocument);
      console.log('POST →', ENDPOINT, {action:'htmlToPdf', row, htmlLength: html.length});

      const res = await fetch(ENDPOINT, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'htmlToPdf', row, html })
      });

      let out={}; try{ out = await res.json(); }catch(e){ console.warn('No JSON', e); }
      console.log('Response ←', res.status, out);

      if (!res.ok || !out.ok) { toast('Erreur PDF: '+(out.error || res.status), false); return; }
      if (out.pdfUrl) window.open(out.pdfUrl, '_blank');
      toast('PDF généré ✔ (voir colonne AA)');
    }catch(err){
      console.error('sendPdf fatal:', err);
      toast('Erreur JS: '+err.message, false);
    }
  }
  console.log("ENDPOINT utilisé:", ENDPOINT);
  document.getElementById('sendBtn').addEventListener('click', sendPdf);
  </script>
</body>
</html>
